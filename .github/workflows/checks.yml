name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate script syntax
        run: node --check scripts/check.mjs
      - name: Check repository files and documentation
        run: node scripts/check.mjs

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable configured pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript and Vue
        run: pnpm typecheck
      - name: Test IPC boundaries
        run: pnpm test
      - name: Install system mpv for decoding checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
      - name: Test actual mpv with null audio output
        run: pnpm test:playback
      - name: Build desktop application code
        run: pnpm build
